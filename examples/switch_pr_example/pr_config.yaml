version: "1.0"

simulation:
  tool: verilator
  build_dir: build

static_region:
  name: switch_static
  design: switch_static
  sources:
    - rtl/switch_static.sv
    - rtl/axis_switch.sv
  auto_wrap: true
  auto_wrap_config:
    clock_name: clk
    reset_name: rst_n
    reset_active_low: true
  interfaces:
    # Switch AXI-Lite control
    switch_ctrl:
      type: axil
      direction: subordinate
      dw: 32
      base_addr: 0x44A00000
      addr_range: 0x10000

    # DMA0 ↔ add partition
    x0:
      type: sb
      direction: subordinate
      dw: 32
      dma_instance: axi_dma_0
      base_addr: 0x40400000
      addr_range: 0x10000
    y0:
      type: sb
      direction: manager
      dw: 32
      dma_instance: axi_dma_0

    # DMA1 ↔ sub partition
    x1:
      type: sb
      direction: subordinate
      dw: 32
      dma_instance: axi_dma_1
      base_addr: 0x40410000
      addr_range: 0x10000
    y1:
      type: sb
      direction: manager
      dw: 32
      dma_instance: axi_dma_1

    # DMA2 ↔ mult partition
    x2:
      type: sb
      direction: subordinate
      dw: 32
      dma_instance: axi_dma_2
      base_addr: 0x40420000
      addr_range: 0x10000
    y2:
      type: sb
      direction: manager
      dw: 32
      dma_instance: axi_dma_2

partitions:
  - name: rp_add
    rm_module: add_rm
    clock: clk
    boundary:
      - name: data_in
        direction: to_rm
        width: 32
      - name: result
        direction: from_rm
        width: 32
    initial_rm: add_5

  - name: rp_sub
    rm_module: sub_rm
    clock: clk
    boundary:
      - name: data_in
        direction: to_rm
        width: 32
      - name: result
        direction: from_rm
        width: 32
    initial_rm: sub_3

  - name: rp_mult
    rm_module: mult_rm
    clock: clk
    boundary:
      - name: data_in
        direction: to_rm
        width: 32
      - name: result
        direction: from_rm
        width: 32
    initial_rm: mult_10

reconfigurable_modules:
  - name: add_5
    partition: rp_add
    design: add_rm
    sources: [rtl/add_rm.sv]
    auto_wrap: true
    auto_wrap_config:
      clock_name: clk

  - name: sub_3
    partition: rp_sub
    design: sub_rm
    sources: [rtl/sub_rm.sv]
    auto_wrap: true
    auto_wrap_config:
      clock_name: clk

  - name: mult_10
    partition: rp_mult
    design: mult_rm
    sources: [rtl/mult_rm.sv]
    auto_wrap: true
    auto_wrap_config:
      clock_name: clk
