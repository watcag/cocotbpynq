name: release
on:
  push:
    tags: ["v*"]   # one tag releases both packages at the same version

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Tag, both package versions and the pynq-pr pin agree
        run: python scripts/check_versions.py "${GITHUB_REF_NAME#v}"
      - run: |
          pip install build
          python -m build packages/cocotbpynq -o dist
          python -m build packages/pynq-pr -o dist
          python scripts/check_wheel_contents.py dist
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - name: Create GitHub Release with both wheels and sdists
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *rc*|*a[0-9]*|*b[0-9]*|*dev*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "${GITHUB_REF_NAME#v}" --generate-notes $flags

  pypi:
    # Off until PyPI access is set up: set the repository variable PUBLISH_TO_PYPI=true
    # and add this workflow as a Trusted Publisher on pypi.org. pynq-pr is only
    # uploaded once it has a license (repository variable PUBLISH_PYNQ_PR_TO_PYPI=true).
    if: vars.PUBLISH_TO_PYPI == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions: {id-token: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - if: vars.PUBLISH_PYNQ_PR_TO_PYPI != 'true'
        run: rm -f dist/pynq_pr-*
      - uses: pypa/gh-action-pypi-publish@release/v1
