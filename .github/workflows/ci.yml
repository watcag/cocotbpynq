name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly: catch breaking cocotb/pyslang releases

concurrency:   # a newer push to the same branch cancels the stale run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install build twine
      - name: Both packages share one version
        run: python scripts/check_versions.py
      - name: Build both packages
        run: |
          python -m build packages/cocotbpynq -o dist
          python -m build packages/pynq-pr -o dist
          twine check dist/*
      - name: Wheels contain every tracked package file
        run: python scripts/check_wheel_contents.py dist
      - name: Board install of pynq-pr stays light (no cocotb, numpy or cocotbpynq)
        run: |
          python -m venv /tmp/board
          /tmp/board/bin/pip install dist/pynq_pr-*.whl
          /tmp/board/bin/python - <<'PY'
          from importlib.metadata import distributions
          names = {d.metadata["Name"].lower() for d in distributions()}
          extra = names & {"cocotb", "numpy", "cocotbpynq"}
          assert not extra, f"board install pulled in {extra}"
          print("board install:", sorted(names))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

  sim:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # each example runs once, spread over the oldest and newest supported stacks
          - {python: "3.10", cocotb: "2.0.1", cocotbpynq_examples: "axi stream dual_dma", pynq_pr_examples: "add_sub"}
          - {python: "3.14", cocotb: "latest", cocotbpynq_examples: "switch mm_pipeline", pynq_pr_examples: "attention"}
          - {python: "3.12", cocotb: "latest", cocotbpynq_examples: "video_pipeline", pynq_pr_examples: "vision"}
    name: sim (py${{ matrix.python }}, cocotb ${{ matrix.cocotb }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - name: Install the built wheels (not the checkout)
        run: |
          pip install "$(ls dist/cocotbpynq-*.whl)[examples]" "$(ls dist/pynq_pr-*.whl)[sim,examples]" verilator==5.48.0
          if [ "${{ matrix.cocotb }}" != "latest" ]; then pip install "cocotb==${{ matrix.cocotb }}"; fi
          pip list | grep -iE "cocotb|pynq|pyslang|verilator"
      - name: Sample
        run: mkdir -p /tmp/sample && cd /tmp/sample && timeout 300 python -m cocotbpynq.sample
      - name: cocotbpynq PR examples
        run: |
          set -e
          for e in ${{ matrix.cocotbpynq_examples }}; do
            echo "::group::$e"; (cd "examples/cocotbpynq/${e}_pr_example" && timeout 300 python run.py); echo "::endgroup::"
          done
      - name: pynq-pr validate (all example configs)
        run: |
          set -e
          for c in examples/pynq-pr/*/pr_*.yaml; do (cd "$(dirname $c)" && pynq-pr validate -c "$(basename $c)"); done
      - name: pynq-pr examples
        run: |
          set -e
          for e in ${{ matrix.pynq_pr_examples }}; do
            echo "::group::$e"; (cd "examples/pynq-pr/$e" && timeout 300 pynq-pr sim -c pr_z1.yaml --test pr_test.py -f); echo "::endgroup::"
          done
