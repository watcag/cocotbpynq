name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly: catch breaking cocotb/pyslang releases

concurrency:   # a newer push to the same branch cancels the stale run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install build twine
      - run: python -m build && twine check dist/*
      - name: Wheel contains non-Python files
        run: |
          python - <<'PY'
          import glob, zipfile
          n = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert sum(x.endswith(".j2") for x in n) == 14, "codegen templates missing"
          for f in ["_pr_engine/rtl/axis_switch.sv", "sample/sample.hwh", "sample/poly_axi.v",
                    "sample/original_vs_adapted.diff"]:
              assert any(x.endswith(f) for x in n), f + " missing"
          print("wheel contents OK")
          PY
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

  sim:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # oldest and newest supported stacks: sample + quick examples
          - {python: "3.10", cocotb: "2.0.1", examples: "axi switch stream"}
          - {python: "3.14", cocotb: "latest", examples: "axi switch stream"}
          # full example suite once
          - {python: "3.12", cocotb: "latest", examples: "axi dual_dma mm_pipeline stream switch video_pipeline"}
    name: sim (py${{ matrix.python }}, cocotb ${{ matrix.cocotb }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - name: Install the built wheel (not the checkout)
        run: |
          pip install "$(ls dist/*.whl)[examples]" verilator==5.48.0
          if [ "${{ matrix.cocotb }}" != "latest" ]; then pip install "cocotb==${{ matrix.cocotb }}"; fi
          pip list | grep -iE "cocotb|pyslang|verilator"
      - name: Sample
        run: mkdir -p /tmp/sample && cd /tmp/sample && timeout 300 python -m cocotbpynq.sample
      - name: PR examples
        run: |
          set -e
          for e in ${{ matrix.examples }}; do
            echo "::group::$e"
            (cd "examples/${e}_pr_example" && timeout 300 python run.py)
            echo "::endgroup::"
          done
